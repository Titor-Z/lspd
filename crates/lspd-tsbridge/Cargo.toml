[package]
name = "lspd-tsbridge"
description = "TypeScript/JavaScript 语言服务，桥接 compiler/ 下的 tsrs_lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# compiler/ 是独立 workspace（上游 tsrs v0.22.0 的裁剪 fork），以 path 依赖引入
tsrs_core = { path = "../../compiler/crates/tsrs_core" }
tsrs_lsp = { path = "../../compiler/crates/tsrs_lsp" }
tsrs_vfs = { path = "../../compiler/crates/tsrs_vfs" }
