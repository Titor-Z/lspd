name: Site

# 只在 site/ 发生变化时构建并发布官网；发布工作流也会调用本工作流，
# 把页脚版本号写成当次 tag 的版本
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:
    inputs:
      version:
        description: 覆盖页脚版本号（不填则取最新 Release）
        required: false
  workflow_call:
    inputs:
      version:
        description: 本次发布版本号，如 v0.2.0
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 bun 装依赖与构建，锁文件是 bun.lock，不需要 node 的 package-lock
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        working-directory: site
        run: bun install --frozen-lockfile

      - name: 构建
        working-directory: site
        env:
          SITE_VERSION: ${{ inputs.version }}
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
